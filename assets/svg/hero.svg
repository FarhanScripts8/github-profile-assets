
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <style>
    .fade {
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }
    .delay-1 { animation-delay: 0.25s; }
    .delay-2 { animation-delay: 0.5s; }
    .delay-3 { animation-delay: 0.75s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <rect width="900" height="280" rx="20" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="6" fill="#e63946"/>

  <text x="45" y="95" fill="#ffffff" font-size="46" font-weight="700" class="fade">Farhan</text>

  <text x="45" y="140" fill="#9fb3c8" font-size="23" class="fade delay-1">
    Software Engineer · AI/ML Enthusiast · Creator
  </text>

  <text x="45" y="190" fill="#e63946" font-size="22" class="fade delay-2">
    Building CreatorOS
  </text>

  <text x="45" y="235" fill="#64748b" font-size="18" class="fade delay-3">
    Delhi, India · Open to collaborations
  </text>
</svg>
